<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Mahasiswa</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Lindungi halaman: tanpa token, kembali ke login
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <h1>Ubah Mahasiswa</h1>
        <p>Perbarui informasi data mahasiswa pada formulir berikut.</p>

        <form id="form-edit" style="margin-top: 20px;">
            <p><label for="nim">NIM</label><input type="text" id="nim" required></p>
            <p><label for="nama">Nama Lengkap</label><input type="text" id="nama" required></p>
            <p><label for="prodi">Program Studi</label><input type="text" id="prodi" required></p>

            <p>
                <label>Foto Saat Ini</label>
                <div style="margin: 8px 0;">
                    <img id="foto-lama" class="foto-preview" style="width: 80px; height: 80px;" alt="Foto saat ini" hidden>
                    <span id="tanpa-foto">-</span>
                </div>
            </p>
            <p>
                <label for="foto">Ganti Foto (JPG/PNG, maks. 2 MB)</label>
                <input type="file" id="foto" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                <small style="color: var(--text-muted); display: block; margin-top: 4px;">Kosongkan jika tidak ingin mengganti foto.</small>
            </p>

            <div style="margin-top: 24px; display: flex; align-items: center;">
                <button type="submit">Simpan Perubahan</button>
                <a href="dashboard.html" class="btn btn-batal">Batal</a>
            </div>
        </form>
    </div>

    <script src="notifikasi.js"></script>
    <script src="validasi.js"></script>
    <script src="form_edit.js"></script>
</body>
</html>
