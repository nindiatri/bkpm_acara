<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form id="form-login">
        <p>
            <label>Email<br>
                <input type="email" id="email" required>
            </label>
        </p>
        <p>
            <label>Password<br>
                <input type="password" id="password" required>
            </label>
        </p>
        <button type="submit">Login</button>
    </form>
    <script src="login.js"></script>
</body>
</html>
